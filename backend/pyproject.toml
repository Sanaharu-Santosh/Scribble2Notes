[project]
name = "scribble2notes-backend"
version = "0.1.0"
description = "Scribble2Notes API — Lens mode and Scan & Edit mode"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are written by `alembic revision --autogenerate` from a template.
# Hand-formatting them to satisfy the linter only means the next generated one
# fails again.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags FastAPI's Depends()/File() in argument defaults, which is the
# framework's intended idiom rather than a bug.
"app/api/*.py" = ["B008"]
