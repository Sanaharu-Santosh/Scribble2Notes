# Local development. Both services hot-reload on file changes.
#
#   docker compose up            -> API on :8000, web on :5173
#   docker compose --profile phase5 up   -> also starts Postgres
#
# Engine selection comes from backend/.env (copy backend/.env.example), which is
# mounted with the source — so switching engines is an edit and a reload, not a
# rebuild.

services:
  backend:
    build: ./backend
    # Migrate before serving, so a fresh clone comes up with a usable schema
    # rather than 500s on the first save.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://scribble:scribble@db:5432/scribble2notes
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scribble
      POSTGRES_PASSWORD: scribble
      POSTGRES_DB: scribble2notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The backend waits on this rather than on the container merely existing:
    # Postgres accepts connections a second or two after the process starts,
    # and without the check the first migration races it and fails.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribble -d scribble2notes"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
